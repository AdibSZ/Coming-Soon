<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>2077 // به زودی</title>
  <meta name="description" content="2077 - به‌زودی دروازه‌ها باز می‌شوند." />
  
  <!-- لوگوی تب مرورگر (Favicon) -->
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="apple-touch-icon" href="logo.svg" />

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Peyda';
      src: url('Peyda-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Peyda';
      src: url('Peyda-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --brand-pink: #f62477;
      --brand-mint: #5df8d8;
      --brand-white: #f5f5f5;
      --brand-dark: #1d1d1b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--brand-dark);
      color: var(--brand-white);
      font-family: 'Peyda', Tahoma, sans-serif;
      min-height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    #bg-stage {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }

    /* لایه مخفی حالت اشعه X (مود ۲) */
    .xray-layer {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-color: #141413;
      background-image: 
        linear-gradient(rgba(93, 248, 216, 0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(93, 248, 216, 0.14) 1px, transparent 1px);
      background-size: 38px 38px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--brand-mint);
      font-size: 11px;
      -webkit-mask-image: radial-gradient(circle 210px at var(--x, 50%) var(--y, 50%), #000 25%, transparent 100%);
      mask-image: radial-gradient(circle 210px at var(--x, 50%) var(--y, 50%), #000 25%, transparent 100%);
      pointer-events: none;
    }

    .xray-watermark {
      font-size: 16vw;
      font-weight: 800;
      color: rgba(246, 36, 119, 0.14);
      text-align: center;
      line-height: 0.9;
    }

    .hero-wrapper {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 34px 38px;
      max-width: 480px;
      width: 92%;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    /* باکس شیشه‌ای سایبرپانکی برای مودهای پرباران / متراکم */
    .theme-glass {
      background: rgba(29, 29, 27, 0.78);
      border: 1px solid rgba(93, 248, 216, 0.38);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      clip-path: polygon(24px 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%, 0 24px);
      box-shadow: 0 0 45px rgba(246, 36, 119, 0.2), inset 0 0 20px rgba(93, 248, 216, 0.05);
      pointer-events: auto;
    }

    /* باکس سایبرپانکی پخ‌دار دوگانه */
    .theme-rain-box {
      background: linear-gradient(135deg, var(--brand-pink) 0%, var(--brand-mint) 100%);
      padding: 2px;
      clip-path: polygon(28px 0, 100% 0, 100% calc(100% - 28px), calc(100% - 28px) 100%, 0 100%, 0 28px);
      filter: drop-shadow(0 0 25px rgba(246, 36, 119, 0.35));
      pointer-events: auto;
    }

    .hero-inner {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .theme-rain-box .hero-inner {
      background: rgba(22, 22, 21, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 34px 32px;
      clip-path: polygon(27px 0, 100% 0, 100% calc(100% - 27px), calc(100% - 27px) 100%, 0 100%, 0 27px);
    }

    .theme-rain-box .hero-inner::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 3px;
      background: var(--brand-mint);
      box-shadow: 0 0 12px var(--brand-mint);
    }

    .theme-rain-box .hero-inner::after {
      content: "SYS // 2077";
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 3px;
      color: rgba(246, 36, 119, 0.65);
    }

    .mode-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--brand-mint);
      letter-spacing: 2px;
      margin-bottom: 16px;
      opacity: 0.95;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95), 0 0 10px rgba(93, 248, 216, 0.4);
    }

    .brand-logo {
      width: 145px;
      height: auto;
      margin: 0 auto 16px;
      display: block;
      cursor: pointer;
      pointer-events: auto;
      filter: drop-shadow(0 0 22px rgba(29, 29, 27, 0.95)) drop-shadow(0 0 18px rgba(246, 36, 119, 0.45));
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .brand-logo:hover {
      transform: scale(1.06);
      filter: drop-shadow(0 0 22px rgba(29, 29, 27, 0.95)) drop-shadow(0 0 25px rgba(93, 248, 216, 0.75));
    }

    .brand-logo:active {
      transform: scale(0.95);
    }

    .coming-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--brand-white);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.95), 0 0 12px rgba(0, 0, 0, 0.9);
    }

    .sub-hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: rgba(245, 245, 245, 0.85);
      margin-bottom: 26px;
      letter-spacing: 2px;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
    }

    .tg-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: var(--brand-pink);
      color: var(--brand-white);
      padding: 14px 32px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 14px;
      text-decoration: none;
      letter-spacing: 1.5px;
      clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
      box-shadow: 0 0 25px rgba(246, 36, 119, 0.45);
      transition: all 0.25s ease;
      pointer-events: auto;
    }

    .tg-btn:hover {
      background-color: var(--brand-mint);
      color: var(--brand-dark);
      box-shadow: 0 0 35px rgba(93, 248, 216, 0.75);
      transform: translateY(-2px);
    }

    .interactive-note {
      margin-top: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: rgba(93, 248, 216, 0.85);
      letter-spacing: 1px;
      line-height: 1.6;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95);
    }

    /* ریسپانسیو اختصاصی گوشی‌های موبایل و صفحات باریک */
    @media (max-width: 600px) {
      .hero-wrapper {
        padding: 24px 20px;
        width: 95%;
      }
      .brand-logo {
        width: 115px;
        margin: 0 auto 12px;
      }
      .coming-text {
        font-size: 1.05rem;
        margin-bottom: 6px;
      }
      .sub-hint {
        font-size: 10px;
        margin-bottom: 20px;
        letter-spacing: 1.5px;
      }
      .tg-btn {
        padding: 13px 26px;
        font-size: 13px;
        letter-spacing: 1px;
      }
      .mode-badge {
        font-size: 10px;
        margin-bottom: 12px;
        letter-spacing: 1.5px;
      }
      .interactive-note {
        font-size: 9px;
        margin-top: 14px;
        line-height: 1.5;
      }
      .theme-rain-box .hero-inner {
        padding: 26px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- لایه مخصوص مود ۲ (اشعه X) -->
  <div class="xray-layer" id="xrayLayer">
    <div style="display:flex; justify-content:space-between;">
      <span>[ SYSTEM: 2077 // CLASSIFIED ]</span>
      <span>PALETTE: #F62477 // #5DF8D8</span>
    </div>
    <div class="xray-watermark">2077</div>
    <div style="display:flex; justify-content:space-between;">
      <span>FUTURISTIC • TECHNOLOGICAL • CYBERPUNK</span>
      <span>[ SIGNAL LOCKED ]</span>
    </div>
  </div>

  <!-- کانتینر رندر پس‌زمینه‌ها -->
  <div id="bg-stage"></div>

  <!-- محتوای مرکزی اصلی -->
  <main class="hero-wrapper" id="heroBox">
    <div class="hero-inner">
      <div class="mode-badge" id="modeBadge">[ INITIALIZING... ]</div>
      
      <!-- کلیک یا لمس روی لوگو تم را تغییر می‌دهد -->
      <img src="logo.svg" alt="2077 Logo" class="brand-logo" id="logoBtn" title="کلیک برای تغییر تم (۱ تا ۲۵)" />
      
      <div class="coming-text">به‌زودی دروازه‌ها باز می‌شوند</div>
      <div class="sub-hint">COMING SOON // 2077</div>

      <!-- دکمه کانال تلگرام -->
      <a href="https://t.me/Custom2077" target="_blank" rel="noopener noreferrer" class="tg-btn" id="tgBtn">
        TELEGRAM // 2077
      </a>

      <div class="interactive-note" id="interactiveNote"></div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const stage = document.getElementById('bg-stage');
    const heroBox = document.getElementById('heroBox');
    const modeBadge = document.getElementById('modeBadge');
    const noteEl = document.getElementById('interactiveNote');
    const xrayLayer = document.getElementById('xrayLayer');
    const logoBtn = document.getElementById('logoBtn');
    const tgBtn = document.getElementById('tgBtn');

    // انتخاب رندوم اولیه از بین ۱ تا ۲۵
    let currentMode = Math.floor(Math.random() * 25) + 1;
    let activeAnimId = null;
    let cleanups = [];

    function addCleanup(fn) {
      if (typeof fn === 'function') cleanups.push(fn);
    }

    function bindEvent(target, type, listener, options) {
      target.addEventListener(type, listener, options);
      cleanups.push(() => target.removeEventListener(type, listener, options));
    }

    function resetEnvironment() {
      if (activeAnimId) {
        cancelAnimationFrame(activeAnimId);
        activeAnimId = null;
      }
      while (cleanups.length > 0) {
        try {
          const fn = cleanups.pop();
          if (typeof fn === 'function') fn();
        } catch (err) {
          console.warn('Cleanup error:', err);
        }
      }
      stage.innerHTML = '';
      xrayLayer.style.display = 'none';
      heroBox.className = 'hero-wrapper';
    }

    function create2DCanvas() {
      const canvas = document.createElement('canvas');
      canvas.style.position = 'absolute';
      canvas.style.top = '0';
      canvas.style.left = '0';
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      stage.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      let w = (canvas.width = window.innerWidth);
      let h = (canvas.height = window.innerHeight);
      const onResize = () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      };
      bindEvent(window, 'resize', onResize);
      return { canvas, ctx, getW: () => w, getH: () => h };
    }

    // ==========================================
    // مود ۰۱: هسته کوانتومی سه‌بعدی (Three.js)
    // ==========================================
    function initMode1() {
      modeBadge.textContent = '[ MODE 01 // QUANTUM CORE ]';
      noteEl.innerHTML = '[ CLICK LOGO TO SWITCH THEME ]<br>[ MOVE / SWIPE TO ORBIT • TAP FOR PULSE ]';

      const isMobile = window.innerWidth < 600;
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      stage.appendChild(renderer.domElement);

      const coreGeo = new THREE.IcosahedronGeometry(2.3, 1);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0xf62477, wireframe: true, transparent: true, opacity: 0.45 });
      const core = new THREE.Mesh(coreGeo, coreMat);
      scene.add(core);

      const ringGeo = new THREE.TorusGeometry(3.3, 0.035, 16, 100);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x5df8d8 });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI / 3;
      scene.add(ring);

      const particlesGeo = new THREE.BufferGeometry();
      const count = isMobile ? 450 : 800;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i++) positions[i] = (Math.random() - 0.5) * 16;
      particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const particlesMat = new THREE.PointsMaterial({ size: 0.045, color: 0x5df8d8 });
      const particles = new THREE.Points(particlesGeo, particlesMat);
      scene.add(particles);

      camera.position.z = isMobile ? 8.2 : 6.5;
      let mx = 0, my = 0, pulse = 1;

      const onMouseMove = e => {
        mx = (e.clientX / window.innerWidth - 0.5) * 2;
        my = (e.clientY / window.innerHeight - 0.5) * 2;
      };
      const onTouchMove = e => {
        if (e.touches && e.touches[0]) {
          mx = (e.touches[0].clientX / window.innerWidth - 0.5) * 2;
          my = (e.touches[0].clientY / window.innerHeight - 0.5) * 2;
        }
      };
      const onClick = e => {
        if (e.target !== logoBtn && e.target !== tgBtn) pulse = 1.35;
      };
      const onTouchStart = e => {
        if (e.target !== logoBtn && e.target !== tgBtn) pulse = 1.35;
      };
      const onResize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.position.z = window.innerWidth < 600 ? 8.2 : 6.5;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      };

      bindEvent(window, 'mousemove', onMouseMove);
      bindEvent(window, 'touchmove', onTouchMove, { passive: true });
      bindEvent(window, 'click', onClick);
      bindEvent(window, 'touchstart', onTouchStart, { passive: true });
      bindEvent(window, 'resize', onResize);

      addCleanup(() => {
        renderer.dispose();
        renderer.forceContextLoss?.();
        coreGeo.dispose();
        coreMat.dispose();
        ringGeo.dispose();
        ringMat.dispose();
        particlesGeo.dispose();
        particlesMat.dispose();
      });

      function animate() {
        activeAnimId = requestAnimationFrame(animate);
        pulse += (1 - pulse) * 0.08;
        core.scale.set(pulse, pulse, pulse);
        core.rotation.y += 0.006;
        core.rotation.x += 0.003;
        ring.rotation.z -= 0.01;
        particles.rotation.y -= 0.0015;
        camera.position.x += (mx * 1.5 - camera.position.x) * 0.05;
        camera.position.y += (-my * 1.5 - camera.position.y) * 0.05;
        camera.lookAt(scene.position);
        renderer.render(scene, camera);
      }
      animate();
    }

    // ==========================================
    // مود ۰۲: چراغ‌قوه اشعه X (X-Ray Scanner)
    // ==========================================
    function initMode2() {
      modeBadge.textContent = '[ MODE 02 // X-RAY SCANNER ]';
      noteEl.innerHTML = '[ CLICK LOGO TO SWITCH THEME ]<br>[ MOVE CURSOR / FINGER TO SCAN DARKNESS ]';
      xrayLayer.style.display = 'flex';

      const updateMask = (x, y) => {
        document.documentElement.style.setProperty('--x', x + 'px');
        document.documentElement.style.setProperty('--y', y + 'px');
      };
      const onMouseMove = e => updateMask(e.clientX, e.clientY);
      const onTouchMove = e => {
        if (e.touches && e.touches[0]) updateMask(e.touches[0].clientX, e.touches[0].clientY);
      };

      bindEvent(window, 'mousemove', onMouseMove);
      bindEvent(window, 'touchmove', onTouchMove, { passive: true });
    }

    // ==========================================
    // مود ۰۳: تونل نئونی بی‌پایان (Hyperspace Tunnel)
    // ==========================================
    function initMode3() {
      modeBadge.textContent = '[ MODE 03 // HYPERSPACE TUNNEL ]';
      noteEl.innerHTML = '[ CLICK LOGO TO SWITCH THEME ]<br>[ HOLD CLICK / TOUCH FOR WARP DRIVE ]';
      heroBox.classList.add('theme-glass');

      const { canvas, ctx, getW, getH } = create2DCanvas();
      let speed = 0.014, warp = false;
      const onDown = e => { if (e.target !== logoBtn && e.target !== tgBtn) warp = true; };
      const onUp = () => warp = false;

      bindEvent(window, 'mousedown', onDown);
      bindEvent(window, 'mouseup', onUp);
      bindEvent(window, 'touchstart', onDown, { passive: true });
      bindEvent(window, 'touchend', onUp);

      const rings = Array.from({ length: 26 }, (_, i) => ({ z: i / 26, rot: i * 0.12 }));

      function draw() {
        activeAnimId = requestAnimationFrame(draw);
        const w = getW(), h = getH();
        const cx = w / 2, cy = h / 2;

        ctx.fillStyle = warp ? 'rgba(29, 29, 27, 0.28)' : 'rgba(29, 29, 27, 0.45)';
        ctx.fillRect(0, 0, w, h);

        speed += ((warp ? 0.05 : 0.013) - speed) * 0.08;

        rings.forEach(r => {
          r.z -= speed;
          r.rot += warp ? 0.022 : 0.004;
          if (r.z <= 0.01) r.z = 1;

          const scale = 1 / r.z;
          const size = Math.min(w, h) * 0.45 * scale;
          const alpha = (1 - r.z) * 0.85;

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(r.rot);
          ctx.strokeStyle = warp ? `rgba(246, 36, 119, ${alpha})` : `rgba(93, 248, 216, ${alpha})`;
          ctx.lineWidth = warp ? 3 : 2;
          ctx.strokeRect(-size / 2, -size / 2, size, size);
          ctx.restore();
        });
      }
      draw();
    }

    // ==========================================
    // مود ۰۴: شبیه‌ساز مایع نئونی (WebGL Shader)
    // ==========================================
    function initMode4() {
      modeBadge.textContent = '[ MODE 04 // LIQUID PLASMA ]';
      noteEl.innerHTML = '[ CLICK LOGO TO SWITCH THEME ]<br>[ MOVE / SWIPE TO DISTORT FIELD ]';
      heroBox.classList.add('theme-glass');

      const canvas = document.createElement('canvas');
      canvas.style.position = 'absolute';
      canvas.style.inset = '0';
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      stage.appendChild(canvas);
      const gl = canvas.getContext('webgl');
      if (!gl) return;

      const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
      const fs = `
        precision highp float;
        uniform vec2 r;
        uniform float t;
        uniform vec2 m;
        void main() {
          vec2 uv = (gl_FragCoord.xy * 2.0 - r) / min(r.x, r.y);
          vec2 mouse = (m * 2.0 - r) / min(r.x, r.y);
          float d = length(uv - mouse);
          uv += normalize(uv - mouse + 0.001) * exp(-d * 3.0) * 0.25;
          for(float i = 1.0; i < 6.0; i++){
            uv.x += 0.35 / i * sin(i * 3.0 * uv.y + t * 0.8);
            uv.y += 0.35 / i * cos(i * 3.0 * uv.x + t * 0.7);
          }
          float v = sin(uv.x * 4.0 + uv.y * 4.0);
          vec3 colDark = vec3(0.113, 0.113, 0.105);
          vec3 colMint = vec3(0.364, 0.972, 0.847);
          vec3 colPink = vec3(0.964, 0.141, 0.466);
          vec3 color = mix(colDark, colMint * 0.45, smoothstep(0.0, 0.85, v));
          color = mix(color, colPink * 0.55, smoothstep(0.55, 1.0, -v));
          gl_FragColor = vec4(color, 1.0);
        }
      `;

      const createShader = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      };
      const vertShader = createShader(gl.VERTEX_SHADER, vs);
      const fragShader = createShader(gl.FRAGMENT_SHADER, fs);
      const prog = gl.createProgram();
      gl.attachShader(prog, vertShader);
      gl.attachShader(prog, fragShader);
      gl.linkProgram(prog);
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const pLoc = gl.getAttribLocation(prog, 'p');
      gl.enableVertexAttribArray(pLoc);
      gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

      const rLoc = gl.getUniformLocation(prog, 'r');
      const tLoc = gl.getUniformLocation(prog, 't');
      const mLoc = gl.getUniformLocation(prog, 'm');

      let mx = window.innerWidth / 2, my = window.innerHeight / 2;
      const onMouseMove = e => { mx = e.clientX; my = window.innerHeight - e.clientY; };
      const onTouchMove = e => {
        if (e.touches && e.touches[0]) {
          mx = e.touches[0].clientX;
          my = window.innerHeight - e.touches[0].clientY;
        }
      };
      bindEvent(window, 'mousemove', onMouseMove);
      bindEvent(window, 'touchmove', onTouchMove, { passive: true });

      addCleanup(() => {
        gl.getExtension('WEBGL_lose_context')?.loseContext();
      });

      function render(now) {
        activeAnimId = requestAnimationFrame(render);
        if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          gl.viewport(0, 0, canvas.width, canvas.height);
        }
        gl.uniform2f(rLoc, canvas.width, canvas.height);
        gl.uniform1f(tLoc, now * 0.001);

        color: Math.random() > 0.35 ? 'rgba(93, 248, 216, 0.55)' : 'rgba(246, 36, 119, 0.6)'
      }));

      const splashes = [];
      function createSplash(x, y, color) {
        for (let i = 0; i < 4; i++) {
          splashes.push({
            x, y,
            vx: (Math.random() - 0.5) * 4.5,
            vy: -Math.random() * 3.5 - 1,
            life: 1,
            color
          });
        }

        activeAnimId = requestAnimationFrame(animate);
        const w = getW(), h = getH();

        drops.forEach(d => {
          const tipX = d.x + wind * 1.5;
          const tipY = d.y + d.len;

          ctx.strokeStyle = d.color;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(tipX, tipY);
          ctx.stroke();

          d.x += wind;
          d.y += d.speed;

          const isInsideHorizontal = tipX >= rect.left && tipX <= rect.right;
          let surfaceY = rect.top;
          if (tipX < rect.left + 28) {
            surfaceY = rect.top + (28 - (tipX - rect.left));
          }

          if (isInsideHorizontal && tipY >= surfaceY && d.y <= surfaceY + 12) {
            createSplash(tipX, surfaceY, d.color);
            d.y = -20;
            d.x = Math.random() * w;

          if (d.x > w) d.x = 0;
          if (d.x < 0) d.x = w;
        });

        for (let i = splashes.length - 1; i >= 0; i--) {
          const s = splashes[i];
          ctx.fillStyle = s.color;
          ctx.globalAlpha = s.life;
          ctx.fillRect(s.x, s.y, 2, 2);
          s.x += s.vx;
          s.y += s.vy;
          s.vy += 0.25;
          s.life -= 0.06;
          if (s.life <= 0) splashes.splice(i, 1);
        }
        ctx.globalAlpha = 1;
      }
      animate();

        }
      };
      const onClick = e => {
        if (e.target !== logoBtn && e.target !== tgBtn) pulse = 1.0;
      };
      const onTouchStart = e => {
        if (e.target !== logoBtn && e.target !== tgBtn) pulse = 1.0;
      };

      bindEvent(window, 'mousemove', onMouseMove);
      bindEvent(window, 'touchmove', onTouchMove, { passive: true });

      const count = isMobile ? 220 : 380;

      const particles = Array.from({ length: count }, () => ({
        r: (baseHorizonR + 15) + Math.random() * (isMobile ? 180 : 260),

        z: (Math.random() - 0.5) * 35,

        currentTiltX += (targetTiltX - currentTiltX) * 0.05;
        currentTiltY += (targetTiltY - currentTiltY) * 0.05;
        pulse *= 0.92;

        ctx.save();
        ctx.translate(cx, cy);

        // حلقه‌های گرانشی عدسی انیشتین در دوردست
        for (let i = 1; i <= 3; i++) {
          ctx.beginPath();
          ctx.ellipse(0, 0, (isMobile ? 120 : 160) * i + pulse * 45, (isMobile ? 50 : 65 + i * 40) * (0.8 + currentTiltX * 0.4), currentTiltY * 0.4, 0, Math.PI * 2);

            p.r = (isMobile ? 220 : 310) + Math.random() * 70;
          }

          const cosT = Math.cos(p.theta);
          const sinT = Math.sin(p.theta);

          const px = p.r * cosT;
          const py = (p.r * sinT * Math.cos(currentTiltX) - p.z * Math.sin(currentTiltX)) * (0.6 + currentTiltX * 0.25);

          const doppler = (cosT + 1) * 0.5;
          const alpha = 0.25 + doppler * 0.75;

          ctx.fillStyle = p.color;
          ctx.globalAlpha = alpha;
          ctx.beginPath();
          ctx.arc(px, py, p.size * (0.8 + doppler * 0.6), 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;

        // افق رویداد
        ctx.beginPath();
        ctx.arc(0, 0, horizonLimit, 0, Math.PI * 2);
        ctx.fillStyle = '#141413';
        ctx.fill();

        // حلقه فوتونی درخشان نئونی دور افق رویداد
        const photonGrad = ctx.createLinearGradient(-horizonLimit, -horizonLimit, horizonLimit, horizonLimit);
        photonGrad.addColorStop(0, '#f62477');
        photonGrad.addColorStop(0.5, '#f5f5f5');
        photonGrad.addColorStop(1, '#5df8d8');
        ctx.strokeStyle = photonGrad;
        ctx.lineWidth = 3 + pulse * 3;
        ctx.stroke();

        ctx.restore();
      }
      draw();
    }

    function initMode7() {
      modeBadge.textContent = '[ MODE 07 // CYBER DNA HELIX ]';

      const onTouchMove = e => {
        if (e.touches && e.touches[0]) {

        }
      };
      bindEvent(window, 'mousemove', onMouseMove);
      bindEvent(window, 'touchmove', onTouchMove, { passive: true });

      let angle = 0;
      const numRungs = 28;
      const helixRadius = isMobile ? 125 : 160;
      const rungSpacing = isMobile ? 24 : 28;

      function draw() {
        activeAnimId = requestAnimationFrame(draw);
        const w = getW(), h = getH();
        const cx = w / 2, cy = h / 2;

        ctx.fillStyle = 'rgba(29, 29, 27, 0.42)';
        ctx.fillRect(0, 0, w, h);

        const tiltX = ((my / h) - 0.5) * 0.4;
        const tiltY = ((mx / w) - 0.5) * 0.5;
        const speedBoost = Math.hypot((mx / w) - 0.5, (my / h) - 0.5) * 0.04;
        angle += rotSpeed + speedBoost;

        ctx.save();
        ctx.translate(cx, cy);

        const rungs = [];
        for (let i = 0; i < numRungs; i++) {
          const y = (i - numRungs / 2) * rungSpacing;
          const theta = angle + i * 0.28;

          const x1 = Math.cos(theta) * helixRadius;
          const z1 = Math.sin(theta) * helixRadius;

          const x2 = Math.cos(theta + Math.PI) * helixRadius;
          const z2 = Math.sin(theta + Math.PI) * helixRadius;

          const rotX1 = x1 * Math.cos(tiltY) - z1 * Math.sin(tiltY);
          const rotZ1 = x1 * Math.sin(tiltY) + z1 * Math.cos(tiltY);
          const rotY1 = y * Math.cos(tiltX) - rotZ1 * Math.sin(tiltX);

          const rotX2 = x2 * Math.cos(tiltY) - z2 * Math.sin(tiltY);
          const rotZ2 = x2 * Math.sin(tiltY) + z2 * Math.cos(tiltY);
          const rotY2 = y * Math.cos(tiltX) - rotZ2 * Math.sin(tiltX);

          rungs.push({
            p1: { x: rotX1, y: rotY1, z: rotZ1 },
            p2: { x: rotX2, y: rotY2, z: rotZ2 },
            avgZ: (rotZ1 + rotZ2) / 2,
            idx: i
          });
        }

        rungs.sort((a, b) => a.avgZ - b.avgZ);

        rungs.forEach(rung => {
          const zScale1 = (rung.p1.z + 300) / 300;
          const zScale2 = (rung.p2.z + 300) / 300;
          const alpha = 0.3 + ((rung.avgZ + helixRadius) / (helixRadius * 2)) * 0.65;

          ctx.strokeStyle = `rgba(93, 248, 216, ${alpha * 0.45})`;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(rung.p1.x, rung.p1.y);
          ctx.lineTo(rung.p2.x, rung.p2.y);
          ctx.stroke();

          const pulsePos = (Math.sin(angle * 2 + rung.idx * 0.5) + 1) * 0.5;
          const pulseX = rung.p1.x + (rung.p2.x - rung.p1.x) * pulsePos;
          const pulseY = rung.p1.y + (rung.p2.y - rung.p1.y) * pulsePos;
          ctx.fillStyle = '#f5f5f5';
          ctx.beginPath();
          ctx.arc(pulseX, pulseY, 2, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#f62477';
          ctx.beginPath();
          ctx.arc(rung.p1.x, rung.p1.y, Math.max(1.5, 3 * zScale1), 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#5df8d8';
          ctx.beginPath();
          ctx.arc(rung.p2.x, rung.p2.y, Math.max(1.5, 3 * zScale2), 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.restore();
      }
      draw();
    }

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 16, isMobile ? 88 : 75);

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

      const segX = isMobile ? 48 : 64;
      const segY = isMobile ? 48 : 64;
      const canyonWidth = isMobile ? 26 : 32;

      function createTerrainTile(offsetZ) {
        const geo = new THREE.PlaneGeometry(terrainWidth, terrainLength, segX, segY);
        geo.rotateX(-Math.PI / 2);

        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const z = pos.getZ(i);
          const absX = Math.abs(x);

          if (absX > canyonWidth) {
            const flankDist = (absX - canyonWidth) / (terrainWidth / 2 - canyonWidth);
            const peakLayer1 = Math.abs(Math.sin(x * 0.14) * Math.cos(z * 0.08)) * 32;
            const peakLayer2 = Math.abs(Math.sin(x * 0.28 + z * 0.12)) * 16;
            const peakLayer3 = Math.abs(Math.cos(x * 0.05 + z * 0.04)) * 12;
            const height = (peakLayer1 + peakLayer2 + peakLayer3) * Math.pow(flankDist, 1.4);
            pos.setY(i, height);
          } else {
            pos.setY(i, 0);
          }
        }
        geo.computeVertexNormals();

        const solidMat = new THREE.MeshBasicMaterial({ color: 0x1d1d1b });
        const solidMesh = new THREE.Mesh(geo, solidMat);

        const wireMat = new THREE.MeshBasicMaterial({
          color: 0xf62477,
          wireframe: true,
          transparent: true,
          opacity: 0.65
        });
        const wireMesh = new THREE.Mesh(geo, wireMat);

        const group = new THREE.Group();
        group.add(solidMesh);
        group.add(wireMesh);
        group.position.z = offsetZ;

        // کف دره مرکزی با شبکه نئونی نعنایی
        const valleyGeo = new THREE.PlaneGeometry(canyonWidth * 2, terrainLength, 8, segY);
        valleyGeo.rotateX(-Math.PI / 2);
        const valleyMat = new THREE.MeshBasicMaterial({
          color: 0x5df8d8,
          wireframe: true,
          transparent: true,
          opacity: 0.75
        });
        const valleyMesh = new THREE.Mesh(valleyGeo, valleyMat);
        valleyMesh.position.y = 0.15;
        group.add(valleyMesh);

        return { group };
      }

      const tile1 = createTerrainTile(0);
      const tile2 = createTerrainTile(-terrainLength);
      scene.add(tile1.group);
      scene.add(tile2.group);

      let mx = 0, bank = 0;
      const onMouseMove = e => {
        mx = (e.clientX / window.innerWidth - 0.5) * 2;
      };

          mx = (e.touches[0].clientX / window.innerWidth - 0.5) * 2;
        }
      };
      const onResize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.position.z = window.innerWidth < 600 ? 88 : 75;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);

      bindEvent(window, 'mousemove', onMouseMove);
      bindEvent(window, 'touchmove', onTouchMove, { passive: true });
      bindEvent(window, 'resize', onResize);

      addCleanup(() => {
        renderer.dispose();
        renderer.forceContextLoss?.();
        scene.traverse(obj => {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
            else obj.material.dispose();
          }
        });
      });

      const speed = 1.15;
      function animate() {
        activeAnimId = requestAnimationFrame(animate);

        tile1.group.position.z += speed;
        tile2.group.position.z += speed;

        if (tile1.group.position.z >= terrainLength) {
          tile1.group.position.z = tile2.group.position.z - terrainLength;
        }
        if (tile2.group.position.z >= terrainLength) {
          tile2.group.position.z = tile1.group.position.z - terrainLength;
        }

        bank += (mx * 0.22 - bank) * 0.06;
        camera.position.x += (mx * 22 - camera.position.x) * 0.05;
        camera.rotation.z = -bank * 0.35;

        renderer.render(scene, camera);
      }
      animate();
    }

      const isMobile = window.innerWidth < 600;

      let rotXW = 0, rotYW = 0, rotXY = 0;
      let expand = 0, vExpand = 0;
      let mx = window.innerWidth / 2, my = window.innerHeight / 2;

      const onMouseMove = e => { mx = e.clientX; my = e.clientY; };
      const onTouchMove = e => {
        if (e.touches && e.touches[0]) {
          mx = e.touches[0].clientX;

        }
      };

        if (e.target !== logoBtn && e.target !== tgBtn) vExpand = 1.35;
      };

      bindEvent(window, 'mousemove', onMouseMove);
      bindEvent(window, 'touchmove', onTouchMove, { passive: true });
      bindEvent(window, 'click', onClick);
      bindEvent(window, 'touchstart', onTouchStart, { passive: true });

      const vertices = [];
      for (let i = 0; i < 16; i++) {
        vertices.push([
          (i & 1) ? 1 : -1,
          (i & 2) ? 1 : -1,
          (i & 4) ? 1 : -1,
          (i & 8) ? 1 : -1
        ]);
      }

      const edges = [];
      for (let i = 0; i < 16; i++) {
        for (let j = i + 1; j < 16; j++) {
          const diff = (i ^ j);
          if (diff === 1 || diff === 2 || diff === 4 || diff === 8) {
            edges.push([i, j]);
          }
        }
      }

      function draw() {
        activeAnimId = requestAnimationFrame(draw);
        const w = getW(), h = getH();
        const cx = w / 2, cy = h / 2;

        ctx.fillStyle = 'rgba(29, 29, 27, 0.42)';
        ctx.fillRect(0, 0, w, h);

        rotXW += 0.009 + ((mx / w) - 0.5) * 0.02;
        rotYW += 0.007 + ((my / h) - 0.5) * 0.02;
        rotXY += 0.005;

        vExpand += (0 - expand) * 0.08;
        vExpand *= 0.88;
        expand += vExpand;

        const scale = Math.min(w, h) * (isMobile ? 1.25 : 1.55);

        const projected = vertices.map(v => {
          let [x, y, z, w4] = v;
          w4 += (w4 > 0 ? 1 : -1) * expand * 0.7;

          let cos1 = Math.cos(rotXW), sin1 = Math.sin(rotXW);
          let x1 = x * cos1 - w4 * sin1;
          let w1 = x * sin1 + w4 * cos1;

          let cos2 = Math.cos(rotYW), sin2 = Math.sin(rotYW);
          let y1 = y * cos2 - w1 * sin2;
          let w2 = y * sin2 + w1 * cos2;

          let cos3 = Math.cos(rotXY), sin3 = Math.sin(rotXY);
          let x2 = x1 * cos3 - y1 * sin3;
          let y2 = x1 * sin3 + y1 * cos3;

          const dist4 = 2.8;
          const k4 = 1 / (dist4 - w2);
          const x3 = x2 * k4;
          const y3 = y2 * k4;
          const z3 = z * k4;

          const dist3 = 3.2;
          const k3 = 1 / (dist3 - z3);

          return {
            x: cx + x3 * k3 * scale,
            y: cy + y3 * k3 * scale,
            w: w2
          };
        });

        edges.forEach(([i, j]) => {
          const p1 = projected[i];
          const p2 = projected[j];
          const avgW = (p1.w + p2.w) * 0.5;

          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y);
          ctx.lineTo(p2.x, p2.y);

          if (avgW > 0.1) {
            ctx.strokeStyle = `rgba(246, 36, 119, ${0.45 + avgW * 0.5})`;

            ctx.strokeStyle = `rgba(93, 248, 216, ${0.45 - avgW * 0.5})`;
            ctx.lineWidth = 1.6;
          } else {
            ctx.strokeStyle = 'rgba(245, 245, 245, 0.45)';
            ctx.lineWidth = 1.2;
          }
          ctx.stroke();
        });

        projected.forEach(p => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.w > 0 ? 3.5 : 2.5, 0, Math.PI * 2);
          ctx.fillStyle = p.w > 0 ? '#f62477' : '#5df8d8';
          ctx.fill();
        });
      }
      draw();
    }

        }
      };
      bindEvent(window, 'mousemove', onMouseMove);
      bindEvent(window, 'touchmove', onTouchMove, { passive: true });

      const cols = isMobile ? 38 : 52;
      const rows = isMobile ? 26 : 36;
      let t = 0;

      function draw() {
        activeAnimId = requestAnimationFrame(draw);
        const w = getW(), h = getH();
        const cx = w / 2, cy = h * 0.62;

        ctx.fillStyle = 'rgba(29, 29, 27, 0.45)';
        ctx.fillRect(0, 0, w, h);

        t += 0.03;
        const camPitch = 0.45 + ((my / h) - 0.5) * 0.3;
        const camYaw = ((mx / w) - 0.5) * 0.4;

        for (let r = 0; r < rows; r++) {
          const zDepth = (r + 1) / rows;
          const zScale = 1 / (1 + zDepth * 1.8);

          for (let c = 0; c < cols; c++) {
            const u = (c / (cols - 1) - 0.5) * 2;
            const v = (r / (rows - 1));

            let waveY = Math.sin(u * 5 + t) * Math.cos(v * 4 + t * 0.8) * 32
                      + Math.sin((u + v) * 4 - t) * 16;

            const worldX = u * (w * (isMobile ? 0.85 : 0.7));
            const worldZ = v * 500;
            const worldY = waveY;

            const rx = worldX * Math.cos(camYaw) - worldZ * Math.sin(camYaw);
            const rz = worldX * Math.sin(camYaw) + worldZ * Math.cos(camYaw);
            const ry = worldY * Math.cos(camPitch) - rz * Math.sin(camPitch);

            const screenX = cx + rx * (0.8 + v * 0.5);
            const screenY = cy + ry + v * (h * 0.42);

            const distMouse = Math.hypot(screenX - mx, screenY - my);
            let mouseSwell = 0;
            if (distMouse < 180) {
              mouseSwell = (1 - distMouse / 180) * 45;
            }

            const finalY = screenY - mouseSwell;
            const elevation = (waveY + mouseSwell) / 60;

            ctx.beginPath();
            ctx.arc(screenX, finalY, (1.2 + v * 2) * (1 + mouseSwell * 0.02), 0, Math.PI * 2);

            if (elevation > 0.25) {
              ctx.fillStyle = '#f62477';
            } else if (elevation > -0.2) {
              ctx.fillStyle = '#5df8d8';
            } else {
              ctx.fillStyle = 'rgba(93, 248, 216, 0.3)';
            }
            ctx.fill();
          }
        }
      }
      draw();
    }

          ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.fillStyle = '#f62477';
        ctx.beginPath();
        ctx.arc(mx, my, 4.5, 0, Math.PI * 2);
        ctx.fill();

          b.phase += 0.01;
          const currentR = b.radius + Math.sin(b.phase) * 20;

          if (b.x < -currentR) b.x = w + currentR;
          if (b.x > w + currentR) b.x = -currentR;
          if (b.y < -currentR) b.y = h + currentR;
          if (b.y > h + currentR) b.y = -currentR;

          const fogGrad = ctx.createRadialGradient(b.x, b.y, 10, b.x, b.y, currentR);
          fogGrad.addColorStop(0, 'rgba(29, 29, 27, 0.35)');
          fogGrad.addColorStop(0.7, 'rgba(24, 24, 22, 0.18)');
          fogGrad.addColorStop(1, 'transparent');

          ctx.fillStyle = fogGrad;
          ctx.beginPath();
          ctx.arc(b.x, b.y, currentR, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.fillStyle = '#f5f5f5';
        motes.forEach(m => {
          m.x += m.vx;
          m.y += m.vy;
          if (m.y < 0) { m.y = h; m.x = Math.random() * w; }
          const distM = Math.hypot(m.x - mx, m.y - my);
          const alpha = distM < 200 ? 0.8 : 0.25;
          ctx.globalAlpha = alpha;
          ctx.fillRect(m.x, m.y, m.size, m.size);
        });
        ctx.globalAlpha = 1;
      }
      draw();
    }

    // ==========================================
    function initMode19() {
      modeBadge.textContent = '[ MODE 19 // CYBER HEARTBEAT ECG ]';
      noteEl.innerHTML = '[ CLICK LOGO TO SWITCH THEME ]<br>[ HOVER / TAP TELEGRAM TO ACCELERATE BIOMETRICS ]';
      heroBox.classList.add('theme-glass');

      const isMobile = window.innerWidth < 600;
      const { canvas, ctx, getW, getH } = create2DCanvas();
      let mx = window.innerWidth / 2, my = window.innerHeight / 2;

      const onMouseMove = e => { mx = e.clientX; my = e.clientY; };
      const onTouchMove = e => {
        if (e.touches && e.touches[0]) {
          mx = e.touches[0].clientX;
          my = e.touches[0].clientY;
        }
      };
      bindEvent(window, 'mousemove', onMouseMove);
      bindEvent(window, 'touchmove', onTouchMove, { passive: true });

      let sweepX = 0;
      let phase = 0;
      const historyPoints = [];

      function getECGValue(p) {
        const norm = p % 1;
        if (norm < 0.12) return 0;
        if (norm < 0.20) return Math.sin((norm - 0.12) / 0.08 * Math.PI) * 0.18;
        if (norm < 0.28) return 0;
        if (norm < 0.31) return -((norm - 0.28) / 0.03) * 0.22;
        if (norm < 0.35) return ((norm - 0.31) / 0.04) * 1.5;
        if (norm < 0.39) return 1.5 - ((norm - 0.35) / 0.04) * 1.85;
        if (norm < 0.44) return -0.35 + ((norm - 0.39) / 0.05) * 0.35;
        if (norm < 0.52) return 0;
        if (norm < 0.65) return Math.sin((norm - 0.52) / 0.13 * Math.PI) * 0.35;
        return 0;
      }

      function draw() {
        activeAnimId = requestAnimationFrame(draw);
        const w = getW(), h = getH();
        const cy = h * 0.5;

        const tgRect = tgBtn.getBoundingClientRect();
        const distToTg = Math.hypot(mx - (tgRect.left + tgRect.width / 2), my - (tgRect.top + tgRect.height / 2));
        const isNearTg = distToTg < (isMobile ? 130 : 160);

        const bpm = isNearTg ? 165 : 72;
        const speedPhase = isNearTg ? 0.045 : 0.018;
        const color = isNearTg ? '#f62477' : '#5df8d8';
        const sweepSpeed = isNearTg ? (isMobile ? 4.5 : 5.5) : (isMobile ? 2.8 : 3.5);

        ctx.fillStyle = 'rgba(29, 29, 27, 0.32)';
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = 'rgba(93, 248, 216, 0.06)';
        ctx.lineWidth = 1;
        const gridStep = isMobile ? 28 : 35;
        for (let x = 0; x < w; x += gridStep) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
        }
        for (let y = 0; y < h; y += gridStep) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }

        ctx.strokeStyle = 'rgba(93, 248, 216, 0.15)';
        ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();

        phase += speedPhase;
        const ecgAmplitude = isNearTg ? (isMobile ? 90 : 120) : (isMobile ? 55 : 75);
        const ecgVal = getECGValue(phase) * ecgAmplitude;
        sweepX = (sweepX + sweepSpeed);
        if (sweepX > w) {
          sweepX = 0;
          historyPoints.length = 0;
        }

        historyPoints.push({ x: sweepX, y: cy - ecgVal, color });
        if (historyPoints.length > w) historyPoints.shift();

        ctx.lineWidth = isNearTg ? 2.5 : 2;
        ctx.strokeStyle = color;
        ctx.beginPath();
        for (let i = 0; i < historyPoints.length; i++) {
          const pt = historyPoints[i];
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        }
        ctx.stroke();

        ctx.fillStyle = '#f5f5f5';
        ctx.beginPath();
        ctx.arc(sweepX, cy - ecgVal, 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = '11px "JetBrains Mono", monospace';
        ctx.fillStyle = color;
        ctx.fillText(`HR: ${bpm} BPM`, 25, 38);
        ctx.fillText(`SPO2: ${isNearTg ? '96%' : '99%'}`, 125, 38);
        ctx.fillText(`STATUS: ${isNearTg ? 'TACHYCARDIA // TG LINK' : 'NOMINAL'}`, isMobile ? 25 : 225, isMobile ? 54 : 38);
      }
      draw();
    }

          targetSteerY = ((my / getH()) - 0.5) * 140;
        }
      };
      const onDown = e => { if (e.target !== logoBtn && e.target !== tgBtn) warp = true; };
      const onUp = () => warp = false;

      bindEvent(window, 'mousemove', onMouseMove);
      bindEvent(window, 'touchmove', onTouchMove, { passive: true });
      bindEvent(window, 'mousedown', onDown);
      bindEvent(window, 'mouseup', onUp);
      bindEvent(window, 'touchstart', onDown, { passive: true });
      bindEvent(window, 'touchend', onUp);

      const numRings = isMobile ? 24 : 32;
      const rings = Array.from({ length: numRings }, (_, i) => ({
        z: i / numRings,
        rot: i * 0.18
      }));
      let t = 0;

      function draw() {
        activeAnimId = requestAnimationFrame(draw);
        const w = getW(), h = getH();
        const cx = w / 2, cy = h / 2;

        ctx.fillStyle = warp ? 'rgba(29, 29, 27, 0.28)' : 'rgba(29, 29, 27, 0.45)';
        ctx.fillRect(0, 0, w, h);

        t += warp ? 0.05 : 0.02;
        steerX += (targetSteerX - steerX) * 0.05;
        steerY += (targetSteerY - steerY) * 0.05;

        const speed = warp ? 0.035 : 0.012;

        rings.forEach((r, idx) => {
          r.z -= speed;
          if (r.z <= 0.02) r.z = 1;
          r.rot += 0.005;

          const depth = r.z;
          const scale = 1 / (depth * 2.2 + 0.1);
          const ringR = Math.min(w, h) * (isMobile ? 0.24 : 0.28) * scale;
          const ringCenterX = cx + steerX * (1 - depth);
          const ringCenterY = cy + steerY * (1 - depth);
          const alpha = (1 - depth) * 0.85;

          ctx.save();
          ctx.translate(ringCenterX, ringCenterY);
          ctx.rotate(r.rot);

          ctx.beginPath();
          const steps = isMobile ? 40 : 60;
          for (let s = 0; s <= steps; s++) {
            const theta = (s / steps) * Math.PI * 2;
            const wave = Math.sin(theta * 5 + t * 2 + depth * 6) * 0.15
                       + Math.cos(theta * 3 - t) * 0.1;
            const rad = ringR * (1 + wave);
            const px = Math.cos(theta) * rad;
            const py = Math.sin(theta) * rad;
            if (s === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.closePath();

          ctx.strokeStyle = idx % 2 === 0
            ? `rgba(246, 36, 119, ${alpha})`
            : `rgba(93, 248, 216, ${alpha})`;
          ctx.lineWidth = warp ? 2.5 : 1.6;
          ctx.stroke();

          ctx.restore();
        });
      }
      draw();
    }

        case 21: initMode21(); break;
        case 22: initMode22(); break;
        case 23: initMode23(); break;
        case 24: initMode24(); break;
        case 25: initMode25(); break;
        default: initMode1(); break;
      }
    }

    // چرخش ترتیبی بین ۲۵ تم با کلیک یا لمس روی لوگو
    function handleLogoNext(e) {
      e.stopPropagation();
      currentMode = (currentMode % 25) + 1;
      launchMode(currentMode);
    }
    logoBtn.addEventListener('click', handleLogoNext);

    tgBtn.addEventListener('click', (e) => e.stopPropagation());

    // کلیدهای میانبر چپ و راست برای جابجایی سریع
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        currentMode = (currentMode % 25) + 1;
        launchMode(currentMode);
      } else if (e.key === 'ArrowLeft') {
        currentMode = currentMode === 1 ? 25 : currentMode - 1;
        launchMode(currentMode);
      }
    });

    // شروع اولیه با مود انتخاب شده
    launchMode(currentMode);
  </script>
</body>
</html>
