<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2077 // به زودی</title>
  <meta name="description" content="2077 - به‌زودی دروازه‌ها باز می‌شوند." />
  
  <!-- لوگوی شما در تب بالای مرورگر (Favicon) -->
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="apple-touch-icon" href="logo.svg" />

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    /* فراخوانی فونت‌های پیدا موجود در پوشه */
    @font-face {
      font-family: 'Peyda';
      src: url('Peyda-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Peyda';
      src: url('Peyda-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --brand-pink: #f62477;
      --brand-mint: #5df8d8;
      --brand-white: #f5f5f5;
      --brand-dark: #1d1d1b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--brand-dark);
      color: var(--brand-white);
      font-family: 'Peyda', Tahoma, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      user-select: none;
    }

    #bg-stage {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* لایه مخفی مخصوص حالت اشعه X (ایده ۲) */
    .xray-layer {
      position: fixed;
      inset: 0;
      z-index: 1;
      background-color: #141413;
      background-image: 
        linear-gradient(rgba(93, 248, 216, 0.14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(93, 248, 216, 0.14) 1px, transparent 1px);
      background-size: 38px 38px;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--brand-mint);
      font-size: 12px;
      -webkit-mask-image: radial-gradient(circle 230px at var(--x, 50%) var(--y, 50%), #000 25%, transparent 100%);
      mask-image: radial-gradient(circle 230px at var(--x, 50%) var(--y, 50%), #000 25%, transparent 100%);
      pointer-events: none;
    }

    .xray-watermark {
      font-size: 16vw;
      font-weight: 800;
      color: rgba(246, 36, 119, 0.14);
      text-align: center;
      line-height: 0.9;
    }

    .hero-wrapper {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 38px 40px;
      max-width: 480px;
      width: 92%;
      transition: all 0.3s ease;
    }

    /* باکس شیشه‌ای سایبرپانکی برای تم ۳ و ۴ (دقیقاً هم‌فرم دکمه تلگرام) */
    .theme-glass {
      background: rgba(29, 29, 27, 0.65);
      border: 1px solid rgba(93, 248, 216, 0.35);
      backdrop-filter: blur(8px);
      clip-path: polygon(24px 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%, 0 24px);
      box-shadow: 0 0 40px rgba(246, 36, 119, 0.15);
    }

    /* باکس سایبرپانکی تم ۵ (فقط بالا-چپ و پایین-راست برش خورده مثل دکمه تلگرام) */
    .theme-rain-box {
      background: linear-gradient(135deg, var(--brand-pink) 0%, var(--brand-mint) 100%);
      padding: 2px;
      clip-path: polygon(28px 0, 100% 0, 100% calc(100% - 28px), calc(100% - 28px) 100%, 0 100%, 0 28px);
      filter: drop-shadow(0 0 25px rgba(246, 36, 119, 0.35));
    }

    .hero-inner {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .theme-rain-box .hero-inner {
      background: rgba(22, 22, 21, 0.94);
      backdrop-filter: blur(10px);
      padding: 38px 36px;
      clip-path: polygon(27px 0, 100% 0, 100% calc(100% - 27px), calc(100% - 27px) 100%, 0 100%, 0 27px);
    }

    /* نوار نورانی لبه بالایی باکس تم ۵ */
    .theme-rain-box .hero-inner::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 3px;
      background: var(--brand-mint);
      box-shadow: 0 0 12px var(--brand-mint);
    }

    .theme-rain-box .hero-inner::after {
      content: "SYS // 2077";
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 3px;
      color: rgba(246, 36, 119, 0.65);
    }

    .mode-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--brand-mint);
      letter-spacing: 2.5px;
      margin-bottom: 18px;
      opacity: 0.85;
    }

    /* لوگوی تعاملی وسط صفحه */
    .brand-logo {
      width: 150px;
      height: auto;
      margin: 0 auto 18px;
      display: block;
      cursor: pointer;
      filter: drop-shadow(0 0 18px rgba(246, 36, 119, 0.45));
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .brand-logo:hover {
      transform: scale(1.06);
      filter: drop-shadow(0 0 25px rgba(93, 248, 216, 0.7));
    }

    .brand-logo:active {
      transform: scale(0.95);
    }

    .coming-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--brand-white);
      margin-bottom: 8px;
    }

    .sub-hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: rgba(245, 245, 245, 0.65);
      margin-bottom: 30px;
    }

    .tg-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: var(--brand-pink);
      color: var(--brand-white);
      padding: 15px 34px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 14px;
      text-decoration: none;
      letter-spacing: 1.5px;
      clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
      box-shadow: 0 0 25px rgba(246, 36, 119, 0.45);
      transition: all 0.25s ease;
    }

    .tg-btn:hover {
      background-color: var(--brand-mint);
      color: var(--brand-dark);
      box-shadow: 0 0 35px rgba(93, 248, 216, 0.75);
      transform: translateY(-2px);
    }

    .interactive-note {
      margin-top: 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: rgba(93, 248, 216, 0.65);
      letter-spacing: 1px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- لایه مخصوص ایده ۲ (اشعه X) -->
  <div class="xray-layer" id="xrayLayer">
    <div style="display:flex; justify-content:space-between;">
      <span>[ SYSTEM: 2077 // CLASSIFIED ]</span>
      <span>PALETTE: #F62477 // #5DF8D8</span>
    </div>
    <div class="xray-watermark">2077</div>
    <div style="display:flex; justify-content:space-between;">
      <span>FUTURISTIC • TECHNOLOGICAL • CYBERPUNK</span>
      <span>[ SIGNAL LOCKED ]</span>
    </div>
  </div>

  <!-- کانتینر رندر گرافیک‌ها -->
  <div id="bg-stage"></div>

  <!-- محتوای مرکزی -->
  <main class="hero-wrapper" id="heroBox">
    <div class="hero-inner">
      <div class="mode-badge" id="modeBadge">[ INITIALIZING... ]</div>
      
      <!-- کلیک روی لوگو تم را به مرحله بعد می‌برد -->
      <img src="logo.svg" alt="2077 Logo" class="brand-logo" id="logoBtn" title="کلیک برای تغییر تم" />
      
      <div class="coming-text">به‌زودی دروازه‌ها باز می‌شوند</div>
      <div class="sub-hint">COMING SOON // 2077</div>

      <!-- لینک مستقیم کانال تلگرام شما -->
      <a href="https://t.me/Custom2077" target="_blank" rel="noopener noreferrer" class="tg-btn">
        TELEGRAM // 2077
      </a>

      <div class="interactive-note" id="interactiveNote"></div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const stage = document.getElementById('bg-stage');
    const heroBox = document.getElementById('heroBox');
    const modeBadge = document.getElementById('modeBadge');
    const noteEl = document.getElementById('interactiveNote');
    const xrayLayer = document.getElementById('xrayLayer');
    const logoBtn = document.getElementById('logoBtn');

    // شروع اولیه با یک عدد تصادفی بین 1 تا 5
    let currentMode = Math.floor(Math.random() * 5) + 1;
    let activeAnimId = null;
    let cleanupFn = null;

    // پاک‌سازی کامل تم قبلی هنگام جابجایی
    function resetEnvironment() {
      if (activeAnimId) {
        cancelAnimationFrame(activeAnimId);
        activeAnimId = null;
      }
      if (cleanupFn) {
        cleanupFn();
        cleanupFn = null;
      }
      stage.innerHTML = '';
      xrayLayer.style.display = 'none';
      heroBox.className = 'hero-wrapper';
    }

    // ==========================================
    // ایده ۱: هسته کوانتومی سه‌بعدی (Three.js)
    // ==========================================
    function initMode1() {
      modeBadge.textContent = '[ MODE 01 // QUANTUM CORE ]';
      noteEl.innerHTML = '[ CLICK LOGO TO SWITCH THEME ]<br>[ MOVE CURSOR TO ORBIT • CLICK BG FOR PULSE ]';

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      stage.appendChild(renderer.domElement);

      const coreGeo = new THREE.IcosahedronGeometry(2.3, 1);
      const coreMat = new THREE.MeshBasicMaterial({ color: 0xf62477, wireframe: true, transparent: true, opacity: 0.45 });
      const core = new THREE.Mesh(coreGeo, coreMat);
      scene.add(core);

      const ringGeo = new THREE.TorusGeometry(3.3, 0.035, 16, 100);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x5df8d8 });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI / 3;
      scene.add(ring);

      const particlesGeo = new THREE.BufferGeometry();
      const count = 800;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i++) positions[i] = (Math.random() - 0.5) * 16;
      particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const particlesMat = new THREE.PointsMaterial({ size: 0.045, color: 0x5df8d8 });
      const particles = new THREE.Points(particlesGeo, particlesMat);
      scene.add(particles);

      camera.position.z = 6.5;
      let mx = 0, my = 0, pulse = 1;

      const onMouseMove = e => {
        mx = (e.clientX / window.innerWidth - 0.5) * 2;
        my = (e.clientY / window.innerHeight - 0.5) * 2;
      };
      const onClick = e => {
        if (e.target !== logoBtn) pulse = 1.35;
      };
      const onResize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      };

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('click', onClick);
      window.addEventListener('resize', onResize);

      cleanupFn = () => {
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('click', onClick);
        window.removeEventListener('resize', onResize);
        renderer.dispose();
      };

      function animate() {
        activeAnimId = requestAnimationFrame(animate);
        pulse += (1 - pulse) * 0.08;
        core.scale.set(pulse, pulse, pulse);
        core.rotation.y += 0.006;
        core.rotation.x += 0.003;
        ring.rotation.z -= 0.01;
        particles.rotation.y -= 0.0015;
        camera.position.x += (mx * 1.5 - camera.position.x) * 0.05;
        camera.position.y += (-my * 1.5 - camera.position.y) * 0.05;
        camera.lookAt(scene.position);
        renderer.render(scene, camera);
      }
      animate();
    }

    // ==========================================
    // ایده ۲: چراغ‌قوه اشعه X (X-Ray Scanner)
    // ==========================================
    function initMode2() {
      modeBadge.textContent = '[ MODE 02 // X-RAY SCANNER ]';
      noteEl.innerHTML = '[ CLICK LOGO TO SWITCH THEME ]<br>[ MOVE CURSOR / FINGER TO SCAN DARKNESS ]';
      xrayLayer.style.display = 'flex';

      const updateMask = (x, y) => {
        document.documentElement.style.setProperty('--x', x + 'px');
        document.documentElement.style.setProperty('--y', y + 'px');
      };
      const onMouseMove = e => updateMask(e.clientX, e.clientY);
      const onTouchMove = e => {
        if (e.touches[0]) updateMask(e.touches[0].clientX, e.touches[0].clientY);
      };

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('touchmove', onTouchMove);

      cleanupFn = () => {
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('touchmove', onTouchMove);
      };
    }

    // ==========================================
    // ایده ۳: تونل نئونی بی‌پایان (Hyperspace Tunnel)
    // ==========================================
    function initMode3() {
      modeBadge.textContent = '[ MODE 03 // HYPERSPACE TUNNEL ]';
      noteEl.innerHTML = '[ CLICK LOGO TO SWITCH THEME ]<br>[ HOLD CLICK / TOUCH FOR WARP DRIVE ]';
      heroBox.classList.add('theme-glass');

      const canvas = document.createElement('canvas');
      stage.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      let w, h, cx, cy;
      const resize = () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        cx = w / 2; cy = h / 2;
      };
      resize();

      let speed = 0.014, warp = false;
      const onDown = e => { if (e.target !== logoBtn) warp = true; };
      const onUp = () => warp = false;

      window.addEventListener('resize', resize);
      window.addEventListener('mousedown', onDown);
      window.addEventListener('mouseup', onUp);
      window.addEventListener('touchstart', onDown);
      window.addEventListener('touchend', onUp);

      cleanupFn = () => {
        window.removeEventListener('resize', resize);
        window.removeEventListener('mousedown', onDown);
        window.removeEventListener('mouseup', onUp);
        window.removeEventListener('touchstart', onDown);
        window.removeEventListener('touchend', onUp);
      };

      const rings = Array.from({ length: 26 }, (_, i) => ({ z: i / 26, rot: i * 0.12 }));

      function draw() {
        activeAnimId = requestAnimationFrame(draw);
        ctx.fillStyle = warp ? 'rgba(29, 29, 27, 0.28)' : 'rgba(29, 29, 27, 0.45)';
        ctx.fillRect(0, 0, w, h);

        speed += ((warp ? 0.05 : 0.013) - speed) * 0.08;

        rings.forEach(r => {
          r.z -= speed;
          r.rot += warp ? 0.022 : 0.004;
          if (r.z <= 0.01) r.z = 1;

          const scale = 1 / r.z;
          const size = Math.min(w, h) * 0.45 * scale;
          const alpha = (1 - r.z) * 0.85;

          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(r.rot);
          ctx.strokeStyle = warp ? `rgba(246, 36, 119, ${alpha})` : `rgba(93, 248, 216, ${alpha})`;
          ctx.lineWidth = warp ? 3 : 2;
          ctx.strokeRect(-size / 2, -size / 2, size, size);
          ctx.restore();
        });
      }
      draw();
    }

    // ==========================================
    // ایده ۴: شبیه‌ساز مایع نئونی (WebGL Shader)
    // ==========================================
    function initMode4() {
      modeBadge.textContent = '[ MODE 04 // LIQUID PLASMA ]';
      noteEl.innerHTML = '[ CLICK LOGO TO SWITCH THEME ]<br>[ MOVE CURSOR TO DISTORT FIELD ]';
      heroBox.classList.add('theme-glass');

      const canvas = document.createElement('canvas');
      stage.appendChild(canvas);
      const gl = canvas.getContext('webgl');

      const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;
      const fs = `
        precision highp float;
        uniform vec2 r;
        uniform float t;
        uniform vec2 m;
        void main() {
          vec2 uv = (gl_FragCoord.xy * 2.0 - r) / min(r.x, r.y);
          vec2 mouse = (m * 2.0 - r) / min(r.x, r.y);
          float d = length(uv - mouse);
          uv += normalize(uv - mouse + 0.001) * exp(-d * 3.0) * 0.25;
          for(float i = 1.0; i < 6.0; i++){
            uv.x += 0.35 / i * sin(i * 3.0 * uv.y + t * 0.8);
            uv.y += 0.35 / i * cos(i * 3.0 * uv.x + t * 0.7);
          }
          float v = sin(uv.x * 4.0 + uv.y * 4.0);
          vec3 colDark = vec3(0.113, 0.113, 0.105);
          vec3 colMint = vec3(0.364, 0.972, 0.847);
          vec3 colPink = vec3(0.964, 0.141, 0.466);
          vec3 color = mix(colDark, colMint * 0.45, smoothstep(0.0, 0.85, v));
          color = mix(color, colPink * 0.55, smoothstep(0.55, 1.0, -v));
          gl_FragColor = vec4(color, 1.0);
        }
      `;

      const createShader = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      };
      const prog = gl.createProgram();
      gl.attachShader(prog, createShader(gl.VERTEX_SHADER, vs));
      gl.attachShader(prog, createShader(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog);
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const pLoc = gl.getAttribLocation(prog, 'p');
      gl.enableVertexAttribArray(pLoc);
      gl.vertexAttribPointer(pLoc, 2, gl.FLOAT, false, 0, 0);

      const rLoc = gl.getUniformLocation(prog, 'r');
      const tLoc = gl.getUniformLocation(prog, 't');
      const mLoc = gl.getUniformLocation(prog, 'm');

      let mx = window.innerWidth / 2, my = window.innerHeight / 2;
      const onMouseMove = e => { mx = e.clientX; my = window.innerHeight - e.clientY; };
      window.addEventListener('mousemove', onMouseMove);

      cleanupFn = () => {
        window.removeEventListener('mousemove', onMouseMove);
      };

      function render(now) {
        activeAnimId = requestAnimationFrame(render);
        if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          gl.viewport(0, 0, canvas.width, canvas.height);
        }
        gl.uniform2f(rLoc, canvas.width, canvas.height);
        gl.uniform1f(tLoc, now * 0.001);
        gl.uniform2f(mLoc, mx, my);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }
      activeAnimId = requestAnimationFrame(render);
    }

    // ==========================================
    // ایده ۵: باران نئونی و برخورد دقیق قطرات به لبه باکس
    // ==========================================
    function initMode5() {
      modeBadge.textContent = '[ MODE 05 // CYBER RAIN ]';
      noteEl.innerHTML = '[ CLICK LOGO TO SWITCH THEME ]<br>[ MOVE CURSOR TO CONTROL WIND ]';
      heroBox.classList.add('theme-rain-box');

      const canvas = document.createElement('canvas');
      stage.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      let w, h;

      const updateSize = () => {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      };
      updateSize();

      let wind = 1.5;
      const onMouseMove = e => { wind = ((e.clientX / w) - 0.5) * 6; };

      window.addEventListener('resize', updateSize);
      window.addEventListener('mousemove', onMouseMove);

      cleanupFn = () => {
        window.removeEventListener('resize', updateSize);
        window.removeEventListener('mousemove', onMouseMove);
      };

      const drops = Array.from({ length: 180 }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        len: 12 + Math.random() * 18,
        speed: 9 + Math.random() * 7,
        color: Math.random() > 0.35 ? 'rgba(93, 248, 216, 0.55)' : 'rgba(246, 36, 119, 0.6)'
      }));

      const splashes = [];
      function createSplash(x, y, color) {
        for (let i = 0; i < 4; i++) {
          splashes.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 4.5,
            vy: -Math.random() * 3.5 - 1,
            life: 1,
            color
          });
        }
      }

      function animate() {
        activeAnimId = requestAnimationFrame(animate);
        ctx.clearRect(0, 0, w, h);

        // خواندن زنده و دقیق مختصات باکس در هر فریم
        const rect = heroBox.getBoundingClientRect();

        drops.forEach(d => {
          const tipX = d.x + wind * 1.5;
          const tipY = d.y + d.len;

          ctx.strokeStyle = d.color;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(tipX, tipY);
          ctx.stroke();

          d.x += wind;
          d.y += d.speed;

          // محاسبه سطح بالای باکس با در نظر گرفتن پخ ۲۸ پیکسلی گوشه بالا-چپ
          const isInsideHorizontal = tipX >= rect.left && tipX <= rect.right;
          let surfaceY = rect.top;
          if (tipX < rect.left + 28) {
            // شیب ۴۵ درجه گوشه بالا-چپ
            surfaceY = rect.top + (28 - (tipX - rect.left));
          }

          // برخورد نوک قطره دقیقاً با لبه بالایی باکس
          if (isInsideHorizontal && tipY >= surfaceY && d.y <= surfaceY + 12) {
            createSplash(tipX, surfaceY, d.color);
            d.y = -20;
            d.x = Math.random() * w;
          }

          // برخورد با کف صفحه
          if (d.y > h) {
            if (Math.random() > 0.65) createSplash(d.x, h - 2, d.color);
            d.y = -20;
            d.x = Math.random() * w;
          }
          if (d.x > w) d.x = 0;
          if (d.x < 0) d.x = w;
        });

        for (let i = splashes.length - 1; i >= 0; i--) {
          const s = splashes[i];
          ctx.fillStyle = s.color;
          ctx.globalAlpha = s.life;
          ctx.fillRect(s.x, s.y, 2, 2);
          s.x += s.vx;
          s.y += s.vy;
          s.vy += 0.25;
          s.life -= 0.06;
          if (s.life <= 0) splashes.splice(i, 1);
        }
        ctx.globalAlpha = 1;
      }
      animate();
    }

    // تابع اجرای تم بر اساس شماره (1 تا 5)
    function launchMode(mode) {
      resetEnvironment();
      if (mode === 1) initMode1();
      else if (mode === 2) initMode2();
      else if (mode === 3) initMode3();
      else if (mode === 4) initMode4();
      else initMode5();
    }

    // کلیک روی لوگو -> رفتن به تم بعدی (و برگشت از 5 به 1)
    logoBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentMode = (currentMode % 5) + 1;
      launchMode(currentMode);
    });

    // اجرای اولیه هنگام باز شدن صفحه
    launchMode(currentMode);
  </script>
</body>
